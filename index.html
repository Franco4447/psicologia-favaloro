        slider.scrollTop = scrollTop - (y - startY) * 1.2;
      });
      
      // Touch events for mobile
      slider.addEventListener('touchstart', (e) => {
        if (e.target.closest('button, input, .cursor-pointer')) return;
        isDown = true;
        isDragging = false;
        startX = e.touches[0].pageX - slider.offsetLeft;
        startY = e.touches[0].pageY - slider.offsetTop;
        scrollLeft = slider.scrollLeft;
        scrollTop = slider.scrollTop;
      });
      window.addEventListener('touchend', () => {
        isDown = false;
      });
      window.addEventListener('touchmove', (e) => {
        if (!isDown) return;
        const x = e.touches[0].pageX - slider.offsetLeft;
        const y = e.touches[0].pageY - slider.offsetTop;
        if (Math.abs(x - startX) > 3 || Math.abs(y - startY) > 3) isDragging = true;
        slider.scrollLeft = scrollLeft - (x - startX) * 1.5;
        slider.scrollTop = scrollTop - (y - startY) * 1.5;
      }, {passive: false});
      
      // Intercept the click event before React handles it
      slider.addEventListener('click', (e) => {
        if (isDragging) {
            e.stopPropagation();
            e.preventDefault();
        }
      }, true); // Use capture phase
    }
  });
  observer.observe(document.body, { childList: true, subtree: true });
});
</script>
</body>
